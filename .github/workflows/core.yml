name: Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build core like Unity does
        run: dotnet build tools/Core/Core.csproj
      - name: Test core
        run: dotnet test tools/CoreTests/CoreTests.csproj --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests
          path: tools/CoreTests/TestResults
