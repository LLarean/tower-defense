name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        default: StandaloneWindows64
        options:
          - StandaloneWindows64
          - WebGL
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A manual run builds the chosen platform; a release tag builds both.
        platform: ${{ fromJSON(inputs.platform && format('["{0}"]', inputs.platform) || '["StandaloneWindows64", "WebGL"]') }}
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
    steps:
      # The Unity editor image does not fit on a stock runner.
      - uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main, 2026-10-06
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v7

      - id: name
        run: |
          # A release tag defines the version; other builds take it from the project settings.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -oP '^\s*bundleVersion: \K\S+' ProjectSettings/ProjectSettings.asset)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "value=BattleOfTheElements-$version-b$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.TARGET_PLATFORM }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: ${{ steps.name.outputs.value }}
          versioning: Custom
          version: ${{ steps.name.outputs.version }}

      # The player ships without Unity's debug folders; the builder leaves its output owned by root.
      - if: env.TARGET_PLATFORM == 'StandaloneWindows64'
        run: sudo rm -rf build/StandaloneWindows64/*_DoNotShip build/StandaloneWindows64/*_BackUpThisFolder_ButDontShipItWithYourGame

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.value }}-${{ env.TARGET_PLATFORM }}
          path: build/${{ env.TARGET_PLATFORM }}
          if-no-files-found: error
          retention-days: 14

      # WebGL goes to GitHub Pages; the decompression fallback lets it run without Gzip headers.
      - if: env.TARGET_PLATFORM == 'WebGL'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL/${{ steps.name.outputs.value }}

      - if: startsWith(github.ref, 'refs/tags/') && env.TARGET_PLATFORM == 'StandaloneWindows64'
        run: cd build/StandaloneWindows64 && sudo zip -qr "../${{ steps.name.outputs.value }}-Windows.zip" .

      - if: startsWith(github.ref, 'refs/tags/') && env.TARGET_PLATFORM == 'StandaloneWindows64'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          fail_on_unmatched_files: true

  pages:
    name: Publish to GitHub Pages
    needs: build
    if: inputs.platform == 'WebGL' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
